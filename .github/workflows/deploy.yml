name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set public site URL for SEO
        env:
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$SITE_URL_OVERRIDE" ]; then
            site_url="$SITE_URL_OVERRIDE"
          else
            owner="${GITHUB_REPOSITORY%%/*}"
            repository="${GITHUB_REPOSITORY#*/}"
            if [ "$repository" = "$owner.github.io" ]; then
              site_url="https://$owner.github.io/"
            else
              site_url="https://$owner.github.io/$repository/"
            fi
          fi
          echo "VITE_SITE_URL=$site_url" >> "$GITHUB_ENV"
      - name: Build
        run: npm run build
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
